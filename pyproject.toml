[project]
name = "spysignal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "matplotlib", "yfinance", "vectorbt"]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab", "ipykernel"]

[tool.setuptools]
packages = ["spysignal"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
